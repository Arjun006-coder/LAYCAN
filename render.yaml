services:
  - type: web
    name: laycan-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.11
      - key: GEMINI_API_KEY
        sync: false
      - key: EIA_API_KEY
        sync: false
      - key: AISSTREAM_API_KEY
        sync: false
